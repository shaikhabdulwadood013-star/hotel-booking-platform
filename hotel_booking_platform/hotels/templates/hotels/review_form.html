{% extends "hotels/base.html" %}
{% block content %}
<h1>Review {{ hotel.name }}</h1>
<form method="post" class="card">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <p><label>Rating</label><br>{{ form.rating }}{{ form.rating.errors }}</p>
  <p><label>Your review</label><br>{{ form.comment }}{{ form.comment.errors }}</p>
  <button class="btn">Submit review</button>
</form>
{% endblock %}
